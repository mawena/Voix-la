{% extends "base.html" %}
{% block titre %}Se connecter{% endblock %}
{% block largeur %}etroit{% endblock %}
{% block contenu %}
<h1>Se connecter</h1>
<form method="post" action="/connexion" class="carte">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" required value="{{ email or '' }}" autocomplete="email">
  <label for="mdp">Mot de passe</label><input id="mdp" name="mot_de_passe" type="password" required autocomplete="current-password">
  <button class="plein">Se connecter</button>
  <p style="margin-top:.8rem"><a href="/oubli">Mot de passe oublié ?</a></p>
  {% include "_externes.html" %}
</form>
{% if inscription == 'libre' %}<p>Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>{% endif %}
{% endblock %}
