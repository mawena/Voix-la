{% extends "base.html" %}
{% block titre %}Nouveau mot de passe{% endblock %}
{% block largeur %}etroit{% endblock %}
{% block contenu %}
<h1>Nouveau mot de passe</h1>
<form method="post" action="/reinitialiser/{{ jeton }}" class="carte">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="mdp">Mot de passe</label><input id="mdp" name="mot_de_passe" type="password" required minlength="10" autocomplete="new-password">
  <button class="plein">Enregistrer</button>
</form>
{% endblock %}
